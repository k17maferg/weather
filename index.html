<!DOCTYPE html>
<html>
  <head>
    <title>Weather App</title>
  </head>
  <body>
    <h1>Get Weather Info</h1>
    <form action="/" method="post">
      <label for="cityInput">City Name:</label>
      <input
        type="text"
        name="cityInput"
        placeholder="e.g. Honolulu"
      /><br /><br />

      <label for="latInput">Latitude:</label>
      <input type="text" name="latInput" placeholder="e.g. 21.3" /><br /><br />

      <label for="lonInput">Longitude:</label>
      <input
        type="text"
        name="lonInput"
        placeholder="e.g. -157.8"
      /><br /><br />

      <button type="submit">Get Weather</button>
    </form>
  </body>
</html>
